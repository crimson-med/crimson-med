<svg xmlns="http://www.w3.org/2000/svg" width="280" height="200" viewBox="-8 0 280 200" fill="none">
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes march{to{stroke-dashoffset:-40}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) backwards}
.fd{animation:fade .5s ease backwards}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="cr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4D6D"/><stop offset="1" stop-color="#DC143C"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DC143C" stop-opacity=".75"/><stop offset=".45" stop-color="#232832"/><stop offset="1" stop-color="#2DD4BF" stop-opacity=".35"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
  <radialGradient id="fadeMask" cx=".75" cy=".1" r=".9"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gm"><rect width="272" height="200" fill="url(#fadeMask)"/></mask>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="60"/></filter>
  <clipPath id="clip"><rect width="272" height="200" rx="18"/></clipPath>
  
</defs>
<g clip-path="url(#clip)">
  <rect width="272" height="200" fill="#0A0C10"/>
  <rect width="272" height="200" fill="url(#grid)" mask="url(#gm)"/>
  <g class="fu" style="animation-delay:0.15s"><circle cx="272" cy="0" r="90" fill="#DC143C" opacity=".14" filter="url(#blur)"/>
<text x="22" y="36" class="mono" font-size="12" font-weight="600" fill="#DC143C">03<tspan fill="#5A6270"> /06</tspan></text>
<g style="transform-origin:242px 30px;animation:pulse 3s ease-in-out infinite"><circle cx="242" cy="31" r="13" fill="#DC143C" fill-opacity=".12" stroke="#DC143C" stroke-opacity=".5"/><path d="M238 35l8-8M240 27h6v6" stroke="#FF4D6D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="22" y="72" class="sans" font-size="19" font-weight="700" letter-spacing="-.3" fill="#F0F3F6">Cozy Steamworks</text>
<text x="22" y="97" class="sans" font-size="12.5" fill="#8B949E">Refreshed Steam bindings for Node</text>
<text x="22" y="115" class="sans" font-size="12.5" fill="#8B949E">and Electron, with the lobby and</text>
<text x="22" y="133" class="sans" font-size="12.5" fill="#8B949E">leaderboard APIs.</text>
<rect x="22" y="158" width="42.0" height="22" rx="11.0" fill="#151A23" stroke="#232832"/><text x="43.0" y="172.8" text-anchor="middle" class="mono" font-size="10.5" fill="#8B949E">Rust</text>
<rect x="70.03999999999999" y="158" width="61.6" height="22" rx="11.0" fill="#151A23" stroke="#232832"/><text x="100.8" y="172.8" text-anchor="middle" class="mono" font-size="10.5" fill="#8B949E">napi-rs</text>
<rect x="137.60999999999999" y="158" width="42.0" height="22" rx="11.0" fill="#151A23" stroke="#232832"/><text x="158.6" y="172.8" text-anchor="middle" class="mono" font-size="10.5" fill="#8B949E">Node</text></g>
</g>
<rect x=".5" y=".5" width="271" height="199" rx="17.5" stroke="url(#edge)"/>
</svg>