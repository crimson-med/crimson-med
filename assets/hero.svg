<svg xmlns="http://www.w3.org/2000/svg" width="840" height="290" viewBox="0 0 840 290" fill="none">
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes march{to{stroke-dashoffset:-40}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) backwards}
.fd{animation:fade .5s ease backwards}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="cr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4D6D"/><stop offset="1" stop-color="#DC143C"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DC143C" stop-opacity=".75"/><stop offset=".45" stop-color="#232832"/><stop offset="1" stop-color="#2DD4BF" stop-opacity=".35"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
  <radialGradient id="fadeMask" cx=".75" cy=".1" r=".9"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gm"><rect width="840" height="290" fill="url(#fadeMask)"/></mask>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="60"/></filter>
  <clipPath id="clip"><rect width="840" height="290" rx="18"/></clipPath>
  
</defs>
<g clip-path="url(#clip)">
  <rect width="840" height="290" fill="#0A0C10"/>
  <rect width="840" height="290" fill="url(#grid)" mask="url(#gm)"/>
  <circle cx="720" cy="40" r="170" fill="#DC143C" opacity=".32" filter="url(#blur)" style="animation:pulse 6s ease-in-out infinite"/>
<circle cx="80" cy="290" r="140" fill="#2DD4BF" opacity=".08" filter="url(#blur)"/>
<text x="42" y="92" class="sans fu" style="animation-delay:.05s" font-size="52" font-weight="800" letter-spacing="-1.5" fill="#F0F3F6">Burlet <tspan fill="url(#cr)">Médéric</tspan></text>
<text x="44" y="132" class="sans fu" style="animation-delay:.15s" font-size="20" font-weight="500" fill="#F0F3F6" fill-opacity=".9">I help teams make AI actually stick.<tspan fill="#DC143C" dx="4">▍<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
<g class="fu" style="animation-delay:.25s"><path d="M50 155c-3.3 0-6 2.6-6 5.9 0 4.4 6 10.1 6 10.1s6-5.7 6-10.1c0-3.3-2.7-5.9-6-5.9z" fill="#DC143C" fill-opacity=".85"/><circle cx="50" cy="161" r="2" fill="#0A0C10"/><text x="64" y="166" class="mono" font-size="13" fill="#8B949E">Singapore <tspan fill="#5A6270">/</tspan> Lyon <tspan fill="#5A6270">/</tspan> Canada</text><rect x="312" y="150" width="122" height="24" rx="12" fill="#2DD4BF" fill-opacity=".1" stroke="#2DD4BF" stroke-opacity=".5"/><text x="326" y="166" class="mono" font-size="12.5" fill="#2DD4BF">mederic.me ↗</text></g>
<g class="fd" style="animation-delay:.3s"><g style="transform-origin:715px 112px;animation:spin 30s linear infinite"><circle cx="715" cy="112" r="76" stroke="#DC143C" stroke-opacity=".35" stroke-dasharray="2 8"/><circle cx="791" cy="112" r="4" fill="#FF4D6D" filter="url(#glow)"/></g><g style="transform-origin:715px 112px;animation:spinr 18s linear infinite"><circle cx="715" cy="112" r="58" stroke="#2DD4BF" stroke-opacity=".3" stroke-dasharray="40 14 4 14"/><circle cx="715" cy="54" r="3" fill="#2DD4BF"/></g><polygon points="715.0,74.0 747.9,93.0 747.9,131.0 715.0,150.0 682.1,131.0 682.1,93.0" fill="#DC143C" fill-opacity=".12" stroke="url(#cr)" stroke-width="1.5"/><text x="715" y="121" text-anchor="middle" class="sans" font-size="26" font-weight="800" letter-spacing="-.5" fill="url(#cr)">MB</text></g>
<g class="fu" style="animation-delay:0.35s"><rect x="44" y="202" width="176" height="62" rx="12" fill="#10131A" fill-opacity=".85" stroke="#232832"/><rect x="44" y="216" width="3" height="34" rx="1.5" fill="url(#cr)"/><text x="62" y="231" class="sans" font-size="22" font-weight="800" fill="#F0F3F6">1500+</text><text x="62" y="251" class="sans" font-size="9.5" font-weight="600" letter-spacing="1.3" fill="#8B949E">PRACTITIONERS TRAINED</text></g>
<g class="fu" style="animation-delay:0.45s"><rect x="236" y="202" width="176" height="62" rx="12" fill="#10131A" fill-opacity=".85" stroke="#232832"/><rect x="236" y="216" width="3" height="34" rx="1.5" fill="url(#cr)"/><text x="254" y="231" class="sans" font-size="22" font-weight="800" fill="#F0F3F6">2-3x</text><text x="254" y="251" class="sans" font-size="9.5" font-weight="600" letter-spacing="1.3" fill="#8B949E">DELIVERY PRODUCTIVITY</text></g>
<g class="fu" style="animation-delay:0.55s"><rect x="428" y="202" width="176" height="62" rx="12" fill="#10131A" fill-opacity=".85" stroke="#232832"/><rect x="428" y="216" width="3" height="34" rx="1.5" fill="url(#cr)"/><text x="446" y="231" class="sans" font-size="22" font-weight="800" fill="#F0F3F6">9+ yrs</text><text x="446" y="251" class="sans" font-size="9.5" font-weight="600" letter-spacing="1.3" fill="#8B949E">ENTERPRISE DELIVERY</text></g>
<g class="fu" style="animation-delay:0.65s"><rect x="620" y="202" width="176" height="62" rx="12" fill="#10131A" fill-opacity=".85" stroke="#232832"/><rect x="620" y="216" width="3" height="34" rx="1.5" fill="url(#cr)"/><text x="638" y="231" class="sans" font-size="22" font-weight="800" fill="#F0F3F6">10+</text><text x="638" y="251" class="sans" font-size="9.5" font-weight="600" letter-spacing="1.3" fill="#8B949E">OSS RELEASES IN 2026</text></g>
</g>
<rect x=".5" y=".5" width="839" height="289" rx="17.5" stroke="url(#edge)"/>
</svg>